{% load static %}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6fa"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="{% url 'owner_panel:manifest' %}"><link rel="apple-touch-icon" href="{% static 'owner_panel/icon-192.png' %}"><link rel="stylesheet" href="{% static 'owner_panel/app.css' %}?v=8"><title>Вход · Control</title></head><body class="login-page"><main class="login-card"><div class="brand-mark">C<span>•</span></div><div class="eyebrow">ВАШИ ПРОЕКТЫ. ОДНО МЕСТО.</div><h1>Всё под контролем.</h1><p class="muted">Оплаты, пользователи и доступы<br>Who-Update и GhostNote.</p><form method="post">{% csrf_token %}<label>Логин администратора<input name="username" autocomplete="username" autocapitalize="none" required autofocus maxlength="150"></label><label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button class="primary" type="submit">Войти в панель <span>↗</span></button></form><p class="login-foot">Закрытая панель владельца · московское время</p></main></body></html>

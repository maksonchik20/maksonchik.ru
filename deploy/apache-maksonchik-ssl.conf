<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName maksonchik.ru
    ServerAlias www.maksonchik.ru

    ErrorLog ${APACHE_LOG_DIR}/maksonchik-error.log
    CustomLog ${APACHE_LOG_DIR}/maksonchik-access.log combined

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass /static/ !
    ProxyPass /who-update-demo-media/ !
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    Alias /static/ /srv/maksonchik/app/static/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Require all granted
    </Directory>
    <Directory /srv/maksonchik/app/static>
        Require all granted
    </Directory>

    ProxyPass / http://127.0.0.1:8010/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:8010/

    Header unset X-Frame-Options
    Header always unset X-Frame-Options
    SetEnvIfNoCase Referer "^https?://([^/]+\.)?(maksonchik\.ru|webvisor\.com|metri[ck]a\.yandex\.(com|ru|by|com\.tr))/" iframe_allowed
    Header always set X-Frame-Options "SAMEORIGIN" env=!iframe_allowed

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/maksonchik.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/maksonchik.ru/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
